[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nav"
version = "0.1.0"
description = "NAV -- Navigate · Augment · Venture"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27.0"]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
voice = [
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "faster-whisper>=1.0.0",
    "pyttsx3>=2.90",
]

[tool.setuptools.packages.find]
include = ["core*", "capabilities*", "ai*", "interfaces*", "security*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "sounddevice.*",
    "sounddevice",
    "numpy.*",
    "numpy",
    "faster_whisper.*",
    "faster_whisper",
    "pyttsx3.*",
    "pyttsx3",
]
ignore_missing_imports = true